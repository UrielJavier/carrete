<!DOCTYPE html>
<!--
  Fuente reproducible de la imagen social (Open Graph), 1200×630.
  Render:  Chrome headless --screenshot  →  ../public/og.png
  Coherente con el sistema de diseño: fondo #0a0a0a, monoespaciada, acento #6ea8fe.
-->
<html lang="es">
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: #0a0a0a;
    --text: #f5f5f5;
    --dim: #8a8a8a;
    --faint: #5c5c5c;
    --line: #262626;
    --accent: #6ea8fe;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "SF Mono", Menlo, ui-monospace, monospace;
    display: flex;
    align-items: center;
    overflow: hidden;
    position: relative;
  }
  /* rejilla tenue de fondo, guiño al lienzo del editor */
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 60px 60px;
    opacity: 0.35;
    mask-image: radial-gradient(120% 100% at 20% 50%, #000 40%, transparent 85%);
  }

  .left { padding: 0 0 0 90px; width: 660px; position: relative; z-index: 2; }
  .word { font-size: 128px; font-weight: 700; letter-spacing: 0.1em; line-height: 0.95; }
  .rule { width: 96px; height: 5px; background: var(--accent); margin: 34px 0 34px; }
  .tag { color: var(--text); font-size: 40px; font-weight: 500; line-height: 1.3; max-width: 560px; }
  .sub { color: var(--dim); font-size: 27px; margin-top: 22px; letter-spacing: 0.02em; }

  /* maqueta de móvil con un carrusel a la derecha */
  .right { position: absolute; right: 92px; top: 50%; transform: translateY(-50%); z-index: 2; }
  .phone {
    width: 320px; height: 470px; border: 2px solid var(--line);
    background: #111; position: relative; padding: 14px;
    display: grid; grid-template-rows: 1fr 1fr; gap: 10px;
  }
  .cell { border: 1px solid #2c2c2c; background: #161616; position: relative; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  /* celda seleccionada: esquinas de acento, como en el editor */
  .sel { border-color: var(--accent); }
  .sel::before, .sel::after {
    content: ""; position: absolute; width: 16px; height: 16px; border: 3px solid var(--accent);
  }
  .sel::before { top: -1px; left: -1px; border-right: 0; border-bottom: 0; }
  .sel::after { bottom: -1px; right: -1px; border-left: 0; border-top: 0; }
  /* chapa de grupo */
  .badge {
    position: absolute; top: 8px; left: 8px; width: 26px; height: 26px;
    display: grid; place-items: center; color: #0a0a0a; font-weight: 700; font-size: 15px;
  }
  /* puntos del carrusel */
  .dots { position: absolute; left: 0; right: 0; bottom: -34px; display: flex; gap: 10px; justify-content: center; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #333; }
  .dot.on { background: var(--accent); width: 26px; border-radius: 5px; }
</style>
</head>
<body>
  <div class="grid"></div>

  <div class="left">
    <div class="word">MAQUETA</div>
    <div class="rule"></div>
    <div class="tag">Carruseles de Instagram, montados en el móvil.</div>
    <div class="sub">en tu dispositivo · sin nube ni cuentas</div>
  </div>

  <div class="right">
    <div class="phone">
      <div class="cell sel"><span class="badge" style="background:#6ea8fe">1</span></div>
      <div class="row">
        <div class="cell"><span class="badge" style="background:#34d399">2</span></div>
        <div class="cell"></div>
      </div>
      <div class="dots"><span class="dot on"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
    </div>
  </div>
</body>
</html>
